# Shared defaults. Spike configs `extends: base.yaml` and override what they need.
seed: 1337
device: cuda            # auto-falls back to cpu if CUDA is unavailable
experiments_root: experiments

data:
  # NIH ChestX-ray14, 224x224 resized (Kaggle khanfashee). NOT committed (gitignored).
  # Download: https://www.kaggle.com/datasets/khanfashee/nih-chest-x-ray-14-224x224-resized
  # Original full-res source + official split lists: https://nihcc.app.box.com/v/ChestXray-NIHCC
  nih_root: "data"                       # folder holding the CSVs + split files
  nih_images: "data/images-224/images-224"  # note: archive double-nests the image folder
  labels_csv: "data/Data_Entry_2017.csv"
  train_val_list: "data/train_val_list_NIH.txt"
  test_list: "data/test_list_NIH.txt"
  bbox_csv: "data/BBox_List_2017_Official_NIH.csv"  # region GT, useful for V3
  tube_csv: "data/neatx/NIH-CX14_TubeAnnotations_NonExperts_aggregated.csv"  # V4b tube labels
  site2_root: ""        # optional second site (V6)
  image_size: 224

train:
  target_pathology: Pneumothorax
  batch_size: 16        # 6GB laptop GPU shares VRAM with the display; 32 OOMs mid-epoch
  epochs: 5
  lr: 0.0001
  backbone: densenet121
  amp: true             # mixed precision — halves activation memory on the RTX 3050 (6GB)
