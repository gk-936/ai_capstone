# V6 — cross-site OOD: NIH-trained V1 model -> PadChest (Spain). Measure OOD AUC drop + DFR adapt.
# Fill site2_images + padchest_labels_csv once the 12.89GB PadChest 224px set is downloaded.
# Source: http://bimcv.cipf.es/bimcv-projects/padchest/ (224x224 release tar).
extends: base.yaml

spike: v6_padchest

data:
  # PadChest 224px V6 subset (7,573 imgs: 573 PTX-pos + 7k neg, extracted from the tar). Gitignored.
  site2_images: "data/padchest_v6/images-224"
  padchest_labels_csv: "data/padchest_v6_subset.csv"

# V1 clean pneumothorax checkpoint to evaluate cross-site.
mitigation:
  checkpoint: "experiments/v1_baseline/20260707_232704_9fbb04/artifacts/model_best.pth"

data_padchest_max_rows: 0        # 0 = all; set e.g. 8000 for a quick first run
